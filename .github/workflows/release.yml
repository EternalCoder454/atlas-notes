name: Release builds

# Builds the downloadable artifacts: the Windows .zip and the Android .apk.
#
# Windows is built on a Windows runner under MSYS2 rather than cross-compiled,
# because that is the supported way to build GTK4 and libadwaita for Windows:
# MSYS2 packages both, and Linux distributions do not package libadwaita for
# mingw at all. Cross-compiling would mean assembling that sysroot by hand and
# keeping it working.
#
# Android builds the Go core with gomobile and the app around it with Gradle.
#
# It runs on pushes to beta as well as on tags, so a build is checked before it
# is tagged rather than after. Two things dominate the wall clock and both are
# cached between runs: compiling gotk4, which is a very large CGO binding, and
# compiling the Go core once per Android architecture.

# main is here for the caches rather than for the builds.
#
# Actions scopes a cache to the ref that saved it: a run on a tag cannot read
# one saved on beta, and only the default branch's caches are readable from
# every ref. So without this, every tagged release built gotk4 from cold and
# took twenty minutes, which is the one run where that matters most.
#
# Merging to main warms that cache; the tag build then restores it. Give the
# main build time to finish before pushing the tag, or the tag run starts before
# there is anything to restore.
on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Pushing three times in five minutes should not mean three full builds. A run
# supersedes the one before it on the same ref -- except on a tag, where the run
# is producing something people will download.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows (x86_64)
    # Not on pushes to beta. The Windows build is most of this workflow's wall
    # clock, because MSYS2 has to unpack GTK on every run, and a push to beta
    # rarely changes anything Windows-specific. It still runs on main, which
    # every release goes through first, on every tag, and whenever the
    # workflow is started by hand.
    if: github.ref != 'refs/heads/beta' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Defender scans every file written, and most of this job is writing
      # thousands of small ones: unpacking MSYS2's packages, restoring the Go
      # build cache. The runner is a throwaway VM that only ever sees this
      # repository and packages from MSYS2 and Go's own servers.
      - name: Stop real-time scanning for this job
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      # Go comes from here, pinned by go.mod, and not from MSYS2. MSYS2 is a
      # rolling distribution: it moved from Go 1.26.4 to 1.27.1 between two
      # releases, a new compiler invalidates the whole build cache, and the
      # v0.7.0 build spent 17 minutes compiling gotk4 from nothing. Pinned, the
      # cache stays good until go.mod says otherwise, and this is the same Go
      # the Android build uses. setup-go keeps that cache itself, keyed on the
      # Go version and go.sum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MSYS2 with GTK4 and libadwaita
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Inherit the runner's PATH, which is how the pinned Go above is found
          # from inside the MSYS2 shell. MSYS2's own directories still come
          # first, so gcc and pkg-config are MSYS2's.
          path-type: inherit
          # `update` is left at its default of false. Setting it to true runs a
          # full pacman system update on every run, which cost minutes and
          # updated nothing this build depends on.
          #
          # Caching is also on by default, so after the first run these packages
          # come from the action's cache rather than from a mirror.
          #
          # gcc rather than the `toolchain` group: cgo needs a C compiler and a
          # linker, and gcc already pulls binutils, the CRT and the headers. The
          # group adds make, gdb and the rest, which nothing here calls.
          #
          # Go is not installed from here; see setup-go above. cgo needs a C
          # compiler and pkg-config that match these libraries, which is why
          # those two are MSYS2's.
          #
          # gobject-introspection is needed explicitly. gotk4 asks pkg-config
          # for gobject-introspection-1.0 while compiling, and gtk4 depends only
          # on the -runtime package, which ships the libraries without the .pc
          # file pkg-config reads.
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gobject-introspection
            zip

      - name: Confirm the libraries are actually there
        run: |
          # gobject-introspection-1.0 is included deliberately: gotk4 asks for
          # it part-way through a long compile, and finding out then costs
          # several minutes to learn one line.
          pkg-config --modversion gtk4 libadwaita-1 gobject-introspection-1.0
          go version

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)
          echo "Building Atlas Notes $VERSION"
          mkdir -p dist/atlas-notes
          go build -v \
            -ldflags "-s -w -H windowsgui -X 'atlas-notes/internal/app.version=$VERSION'" \
            -o dist/atlas-notes/atlas-notes.exe .
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Bundle the GTK runtime
        # A GTK application on Windows does not run from its executable alone.
        # It needs the DLLs it links against, the compiled schema database, the
        # icon theme it falls back to, and the loaders that decode SVG icons.
        # Leaving any of them out produces an executable that starts and then
        # shows nothing.
        run: |
          set -eu
          out=dist/atlas-notes

          # Every DLL the executable transitively needs, from the MSYS2 prefix.
          ldd "$out/atlas-notes.exe" \
            | awk '/ucrt64/ {print $3}' \
            | sort -u \
            | xargs -r -I{} cp -n {} "$out/"

          mkdir -p "$out/share/glib-2.0/schemas" \
                   "$out/share/icons" \
                   "$out/lib/gdk-pixbuf-2.0"
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled "$out/share/glib-2.0/schemas/"
          cp -r /ucrt64/share/icons/Adwaita     "$out/share/icons/"
          cp -r /ucrt64/share/icons/hicolor     "$out/share/icons/"
          cp -r /ucrt64/lib/gdk-pixbuf-2.0/*    "$out/lib/gdk-pixbuf-2.0/" || true

          # The SVG loader is what draws the app's own symbolic icons.
          if [ -f /ucrt64/bin/librsvg-2-2.dll ]; then
            cp -n /ucrt64/bin/librsvg-2-2.dll "$out/"
          fi

          cp README.md LICENSE NOTICE WHATSNEW.md "$out/"
          ls -la "$out"

      - name: Check it starts
        # A GUI application cannot be opened on a runner, but a missing DLL
        # fails at load time and is reported by the loader, so starting it and
        # stopping it catches the common packaging mistake.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\atlas-notes\atlas-notes.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($p.HasExited -and $p.ExitCode -ne 0) {
            Write-Error "atlas-notes.exe exited immediately with $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "started and stayed running"

      - name: Package
        run: |
          cd dist
          zip -qr "atlas-notes-${VERSION}-windows-x86_64.zip" atlas-notes
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-notes-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

      # Both jobs attach to the same release and whichever finishes last wins.
      # With no body of its own, a job sends an empty string and wipes the notes
      # the other one just wrote. Astral shipped a release with an empty body
      # exactly this way. Sending the same text from both makes the order stop
      # mattering.
      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' WHATSNEW.md > dist/release-notes.md
          cat dist/release-notes.md

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # On by default; named here because this is the cache that matters.
          # gomobile compiles the whole dependency tree once per architecture,
          # and modernc.org/sqlite alone is a great deal of Go.
          cache: true

      # The newest Java the Android build can run on, since AGP 9 and Gradle
      # 9. The app it builds still targets Java 17 bytecode; see
      # app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The runner image already carries the Android SDK, the platform and the
      # build tools this compiles against, and an NDK. Installing our own cost a
      # download of about a gigabyte on every run to arrive at a toolchain that
      # does the same job.
      - name: Use the SDK the runner already has
        run: |
          set -eu
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ndk:         $ANDROID_NDK_ROOT"
          echo "platforms:   $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      # The Go core, built into an .aar the Kotlin app links against. This is
      # the same storage, checklist and encryption code the desktop runs: the
      # phone app is a different interface onto it, not a second implementation
      # of it.
      #
      # gomobile is installed at the version go.mod already pins, because
      # gomobile and the x/mobile package it generates bindings against have to
      # agree, and "@latest" is how they stop agreeing on some future morning.
      - name: Build the Go core for Android
        run: |
          set -eu
          # Both architectures for a release; for a branch build just the one
          # that nearly every phone made in the last decade uses, which halves
          # the slowest step in this job.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TARGETS=android/arm64,android/arm
            ABIS=arm64-v8a,armeabi-v7a
          else
            TARGETS=android/arm64
            ABIS=arm64-v8a
          fi
          echo "targets: $TARGETS"
          # Gradle reads this to keep the APK's advertised ABIs down to the ones
          # the core was just built for.
          echo "ATLAS_ABIS=$ABIS" >> "$GITHUB_ENV"

          V=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          echo "gomobile $V"
          go install "golang.org/x/mobile/cmd/gomobile@$V"
          go install "golang.org/x/mobile/cmd/gobind@$V"
          gomobile init

          mkdir -p packaging/android/app/libs
          gomobile bind \
            -target="$TARGETS" \
            -androidapi 24 \
            -javapkg io.github.atlasnotes.core \
            -o packaging/android/app/libs/atlasbridge.aar \
            ./mobile
          ls -la packaging/android/app/libs

      # Held at v4 deliberately, for the same reason Astral holds it there: v6
      # moved this action's caching into a library that is no longer open
      # source, and a build this small gains nothing worth that trade.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pinned, so the build does not change when the runner image does.
          # AGP 9.4 needs 9.6 or newer, and 9.1 or newer runs on Java 25.
          gradle-version: "9.8.0"

      # The signing key, from the repository's secrets rather than the
      # repository. Android will not replace an app with one signed by a
      # different key, so the key is what makes one build an update to the last
      # rather than a different app wearing its name.
      #
      # Without the secrets the build still works and still produces an
      # installable app, signed with the debug key. It just cannot update a
      # release-signed one, so a fork or a local build is not broken by this.
      - name: Unlock the signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: packaging/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # No --no-daemon: Gradle's own guidance for CI is against it, and it
        # stops the Kotlin compiler daemon being reused within the build.
        run: gradle --build-cache assembleRelease

      - name: Name it after the version
        run: |
          set -eu
          VERSION=$(sed -n 's/^var version = "\(.*\)"/\1/p' internal/app/version.go)
          echo "Atlas Notes $VERSION"
          mkdir -p dist
          cp packaging/android/app/build/outputs/apk/release/app-release.apk \
             "dist/atlas-notes-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -la dist

      # The certificate digest is printed on every run, so that "this release
      # can update the last" is something the log shows rather than something
      # the build asserts. It has to be the same string every time.
      - name: Show who signed it
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs "dist/atlas-notes-${VERSION}.apk" \
            | grep -iE "SHA-256 digest|Signer #1 certificate DN" || true
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo
            echo "::warning::Signed with the debug key, because the release key was not available."
            echo "::warning::Both ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set."
            echo "::warning::This build installs, but cannot update a release-signed one."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-notes-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Take this version's notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          awk -v v="$VERSION" '
            $0 == "## " v { taking = 1; next }
            /^## / && taking  { exit }
            taking            { print }
          ' WHATSNEW.md > dist/release-notes.md
          cat dist/release-notes.md

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
